[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "m3"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy","pandas","scipy","scikit-learn","matplotlib","opencv-python","pyyaml","tqdm","torchinfo","onnx","onnxruntime","pytest"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
